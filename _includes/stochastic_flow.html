<div class="stochastic-flow-container" style="position: relative; width: 100%; height: 300px; background: transparent; border: 1px solid var(--global-divider-color); border-radius: 6px; overflow: hidden; margin: 20px 0;">
  <canvas id="flowCanvas" style="display: block; width: 100%; height: 100%;"></canvas>
</div>

<script>
(function() {
  const canvas = document.getElementById('flowCanvas');
  const ctx = canvas.getContext('2d');
  let animationFrameId;

  // Multi-dimensional Process Configuration
  const processCount = 4;        // Number of independent multivariate path lines
  const maxHistory = 140;        // Path history memory capacity before deletion
  const stepsPerFrame = 4;       // Sub-frame integration steps for crisp high-speed spikes
  const sigma = 3.8;             // Diffusion scaling factor (volatility magnitude)
  
  let processes = [];

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    initProcesses(rect.width, rect.height);
  }

  function initProcesses(w, h) {
    processes = [];
    for (let i = 0; i < processCount; i++) {
      processes.push({
        // Start randomly in the interior domain space
        x: w * 0.25 + Math.random() * w * 0.5,
        y: h * 0.25 + Math.random() * h * 0.5,
        history: [] // Finite historical trajectory array
      });
    }
  }

  // Box-Muller sample generator for true standard normal Gaussian increments
  function getGaussianPair() {
    const u1 = Math.random() || 0.0001;
    const u2 = Math.random() || 0.0001;
    const radius = Math.sqrt(-2.0 * Math.log(u1));
    const angle = 2.0 * Math.PI * u2;
    return { z0: radius * Math.cos(angle), z1: radius * Math.sin(angle) };
  }

  function updateAndDraw(w, h, themeColor) {
    processes.forEach((p, idx) => {
      
      // Perform sub-sampling steps per frame to create high-velocity spiky rendering paths
      for (let s = 0; s < stepsPerFrame; s++) {
        const noise = getGaussianPair();
        
        // Dynamic path tracking state
        p.history.push({ x: p.x, y: p.y });
        
        // Strict boundary history clearing
        if (p.history.length > maxHistory) {
          p.history.shift();
        }

        // Wiener Process increment updates: dX_t = sigma * dW_t
        p.x += sigma * noise.z0;
        p.y += sigma * noise.z1;

        // --- Skorokhod Boundary Reflection Logic ---
        // Instantly reflects coordinates back into the interior if a boundary barrier layout is pierced
        if (p.x < 0)   { p.x = -p.x; }
        if (p.x > w)   { p.x = 2 * w - p.x; }
        if (p.y < 0)   { p.y = -p.y; }
        if (p.y > h)   { p.y = 2 * h - p.y; }
      }

      // Draw the complete active multivariate trajectory memory block
      if (p.history.length < 2) return;

      ctx.beginPath();
      ctx.moveTo(p.history[0].x, p.history[0].y);
      for (let i = 1; i < p.history.length; i++) {
        ctx.lineTo(p.history[i].x, p.history[i].y);
      }

      // Individual path alpha weighting profile based on index mapping variations
      const alphaBase = 0.12 + (idx * 0.04);
      ctx.strokeStyle = themeColor.replace(')', `, ${alphaBase})`).replace('rgb', 'rgba');
      ctx.lineWidth = 1.2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'miter'; // Miter gives razor-sharp spiky joints instead of rounded edges
      ctx.stroke();

      // Draw a solid tracking cursor node right at the current process location head index
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, 2 * Math.PI);
      ctx.fillStyle = themeColor.replace(')', `, ${alphaBase * 2.0})`).replace('rgb', 'rgba');
      ctx.fill();
    });
  }

  resize();
  window.addEventListener('resize', resize);

  function animate() {
    const currentW = canvas.width / window.devicePixelRatio;
    const currentH = canvas.height / window.devicePixelRatio;

    ctx.clearRect(0, 0, currentW, currentH);

    const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--global-theme-color').trim() || 'rgba(0, 123, 255, 1)';

    updateAndDraw(currentW, currentH, themeColor);

    animationFrameId = requestAnimationFrame(animate);
  }

  animate();
})();
</script>
