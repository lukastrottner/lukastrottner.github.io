<div class="stochastic-flow-container" style="position: relative; width: 100%; height: 320px; background: transparent; border: 1px solid var(--global-divider-color); border-radius: 6px; overflow: hidden; margin: 20px 0;">
  <canvas id="flowCanvas" style="display: block; width: 100%; height: 100%;"></canvas>
</div>

<script>
(function() {
  const canvas = document.getElementById('flowCanvas');
  const ctx = canvas.getContext('2d');
  let animationFrameId;

  // Structural Grid Settings (No free-floating tails)
  const gridSpacing = 24; 
  const nodes = [];
  const sigma = 1.4; // Jitter magnitude for the stochastic component
  let globalTime = 0;

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    initGrid(rect.width, rect.height);
  }

  function initGrid(w, h) {
    nodes.length = 0;
    const cols = Math.floor(w / gridSpacing) + 1;
    const rows = Math.floor(h / gridSpacing) + 1;
    
    for (let c = 0; c < cols; c++) {
      for (let r = 0; r < rows; r++) {
        nodes.push({
          baseX: c * gridSpacing + (gridSpacing / 2),
          baseY: r * gridSpacing + (gridSpacing / 2),
          currentX: c * gridSpacing + (gridSpacing / 2),
          currentY: r * gridSpacing + (gridSpacing / 2)
        });
      }
    }
  }

  function drawVectorField(w, h, time, themeColor) {
    const cx = w / 2;
    const cy = h / 2;
    const waveInput = time * 0.015;

    nodes.forEach(node => {
      const dx = node.baseX - cx;
      const dy = node.baseY - cy;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;

      // 1. Structural Deterministic Vector Matrix Field
      // A clean mathematical saddle/vortex transformation that changes over time
      const angle = Math.atan2(dy, dx);
      const force = Math.sin(dist * 0.01 - waveInput) * 8;
      
      const targetX = node.baseX + Math.cos(angle + Math.PI / 2) * force;
      const targetY = node.baseY + Math.sin(angle + Math.PI / 2) * force;

      // 2. Pure Gaussian Stochastic Noise Integration
      const u1 = Math.random() || 0.0001;
      const u2 = Math.random() || 0.0001;
      const nX = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
      const nY = Math.sqrt(-2.0 * Math.log(u1)) * Math.sin(2.0 * Math.PI * u2);

      // Relax current coordinates toward the field target + add pure mathematical noise
      node.currentX += (targetX - node.currentX) * 0.1 + nX * sigma;
      node.currentY += (targetY - node.currentY) * 0.1 + nY * sigma;

      // Draw structural elements (Lines and Crosses instead of trails)
      ctx.beginPath();
      ctx.moveTo(node.baseX, node.baseY);
      ctx.lineTo(node.currentX, node.currentY);
      
      // Opacity fades smoothly near the outer boundaries of the canvas element
      const edgeAlpha = Math.min(1, node.baseX / 40, (w - node.baseX) / 40, node.baseY / 40, (h - node.baseY) / 40);
      const finalAlpha = Math.max(0, 0.25 * edgeAlpha);
      
      ctx.strokeStyle = themeColor.replace(')', `, ${finalAlpha})`).replace('rgb', 'rgba');
      ctx.lineWidth = 1.0;
      ctx.stroke();

      // Render a clean coordinate dot at the displaced node index
      ctx.beginPath();
      ctx.arc(node.currentX, node.currentY, 1.2, 0, 2 * Math.PI);
      ctx.fillStyle = themeColor.replace(')', `, ${finalAlpha * 1.5})`).replace('rgb', 'rgba');
      ctx.fill();
    });
  }

  // Initial trigger setup
  const rect = canvas.parentElement.getBoundingClientRect();
  resize();
  window.addEventListener('resize', resize);

  function animate() {
    globalTime++;
    const currentW = canvas.width / window.devicePixelRatio;
    const currentH = canvas.height / window.devicePixelRatio;

    ctx.clearRect(0, 0, currentW, currentH);

    const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--global-theme-color').trim() || 'rgba(0, 123, 255, 1)';

    drawVectorField(currentW, currentH, globalTime, themeColor);

    animationFrameId = requestAnimationFrame(animate);
  }

  animate();
})();
</script>
