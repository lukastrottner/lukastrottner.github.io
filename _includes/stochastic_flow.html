<div class="stochastic-flow-container" style="position: relative; width: 100%; height: 280px; background: transparent; border: 1px solid var(--global-divider-color); border-radius: 6px; overflow: hidden; margin: 20px 0;">
  <canvas id="flowCanvas" style="display: block; width: 100%; height: 100%;"></canvas>
</div>

<script>
(function() {
  const canvas = document.getElementById('flowCanvas');
  const ctx = canvas.getContext('2d');
  let animationFrameId;
  let globalTime = 0;

  const lineCount = 10; 
  let streamlines = [];

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    initLines(rect.width, rect.height);
  }

  function initLines(w, h) {
    streamlines = [];
    for (let i = 0; i < lineCount; i++) {
      streamlines.push({
        baseY: (h / (lineCount + 1)) * (i + 1),
        seed: Math.random() * 500
      });
    }
  }

  // Pure deterministic pseudo-noise function to generate sharp, reproducible spikes
  function spikeNoise(x) {
    return Math.abs(Math.sin(x) * Math.cos(x * 2.5)) - 0.5;
  }

  function drawFlowField(w, h, time, themeColor) {
    const resolution = 2; // Drastically lowered to 2px for razor-sharp, spiky details
    const fastTime = time * 0.02; // Accelerated timeline for higher energy jitter

    streamlines.forEach((line, index) => {
      ctx.beginPath();
      
      const normalizedRank = index / lineCount;
      const verticalFade = Math.sin(normalizedRank * Math.PI);
      const alpha = 0.05 + verticalFade * 0.18; 

      ctx.strokeStyle = themeColor.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
      ctx.lineWidth = 1.2;

      let first = true;

      for (let x = 0; x <= w; x += resolution) {
        // Multi-frequency Fractal-like Synthesis (Combining macro waves with micro spikes)
        const input1 = x * 0.003 + fastTime * 0.1 + line.seed;
        const input2 = x * 0.015 - fastTime * 0.3 + line.seed * 1.5;
        const input3 = x * 0.06 + fastTime * 0.8 + line.seed * 3.0; // High frequency micro-spike layer

        // 1. Macro trend layout
        const macro = Math.sin(input1) * (h * 0.2);
        
        // 2. Intermediate chaotic jagged layer
        const jagged = spikeNoise(input2) * (h * 0.09);
        
        // 3. Pure spiky fractal noise (high-frequency roughness)
        const microSpikes = (Math.sin(input3) * Math.cos(input3 * 1.7)) * 14;

        // Composite amplitude structure
        const totalDisplacement = macro + jagged + microSpikes;

        // Boundaries padding fade structure
        const edgePadding = 40;
        let edgeFade = 1;
        if (x < edgePadding) edgeFade = x / edgePadding;
        if (x > w - edgePadding) edgeFade = (w - x) / edgePadding;
        
        const finalY = line.baseY + (totalDisplacement * edgeFade);

        if (first) {
          ctx.moveTo(x, finalY);
          first = false;
        } else {
          ctx.lineTo(x, finalY);
        }
      }
      ctx.stroke();
    });
  }

  resize();
  window.addEventListener('resize', resize);

  function animate() {
    globalTime++;
    const currentW = canvas.width / window.devicePixelRatio;
    const currentH = canvas.height / window.devicePixelRatio;

    ctx.clearRect(0, 0, currentW, currentH);

    const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--global-theme-color').trim() || 'rgba(0, 123, 255, 1)';

    drawFlowField(currentW, currentH, globalTime, themeColor);

    animationFrameId = requestAnimationFrame(animate);
  }

  animate();
})();
</script>
