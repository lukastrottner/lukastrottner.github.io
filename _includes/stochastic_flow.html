<div class="stochastic-flow-container" style="position: relative; width: 100%; height: 300px; background: transparent; border: 1px solid var(--global-divider-color); border-radius: 6px; overflow: hidden; margin: 20px 0;">
  <canvas id="flowCanvas" style="display: block; width: 100%; height: 100%;"></canvas>
  <div style="position: absolute; bottom: 8px; right: 12px; font-size: 0.75rem; font-family: monospace; color: var(--global-text-color); opacity: 0.6; pointer-events: none;">
    dX_t = b(X_t)dt + &sigma;dW_t
  </div>
</div>

<script>
(function() {
  const canvas = document.getElementById('flowCanvas');
  const ctx = canvas.getContext('2d');
  let animationFrameId;

  // Configuration
  const particleCount = 65;
  const particles = [];
  const dt = 0.15;
  const sigma = 1.2; // Magnitude of Brownian motion noise

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }

  class Particle {
    constructor(w, h) {
      this.reset(w, h);
      // Stagger initial lifetimes
      this.age = Math.random() * 200;
    }

    reset(w, h) {
      this.x = Math.random() * w;
      this.y = Math.random() * h;
      this.history = [];
      this.maxHistory = 15;
      this.age = 0;
      this.maxAge = 150 + Math.random() * 100;
    }

    update(w, h) {
      this.age++;
      if (this.age > this.maxAge) {
        this.reset(w, h);
        return;
      }

      // Store history for the trajectory tail
      this.history.push({ x: this.x, y: this.y });
      if (this.history.length > this.maxHistory) {
        this.history.shift();
      }

      // 1. Deterministic Drift b(X_t): Converging vortex towards center
      const cx = w / 2;
      const cy = h / 2;
      const dx = this.x - cx;
      const dy = this.y - cy;
      const dist = Math.sqrt(dx * dx + dy * dy) || 1;

      // Combination of sink (pulling inward) and rotation
      const driftX = (-dx / dist) * 1.5 - (dy / dist) * 2.0;
      const driftY = (-dy / dist) * 1.5 + (dx / dist) * 2.0;

      // 2. Stochastic Diffusion Term (Brownian Motion approximation via Box-Muller)
      const u1 = Math.random() || 0.0001;
      const u2 = Math.random() || 0.0001;
      const nX = Math.sqrt(-2.0 * Math.log(u1)) * Math.cos(2.0 * Math.PI * u2);
      const nY = Math.sqrt(-2.0 * Math.log(u1)) * Math.sin(2.0 * Math.PI * u2);

      // SDE Update integration step
      this.x += driftX * dt + sigma * nX * Math.sqrt(dt);
      this.y += driftY * dt + sigma * nY * Math.sqrt(dt);

      // Boundary handling
      if (this.x < 0 || this.x > w || this.y < 0 || this.y > h) {
        this.reset(w, h);
      }
    }

    draw(themeColor) {
      if (this.history.length < 2) return;
      
      // Draw path fading out over time
      for (let i = 1; i < this.history.length; i++) {
        const p1 = this.history[i - 1];
        const p2 = this.history[i];
        const alpha = (i / this.history.length) * (1 - this.age / this.maxAge);
        
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.strokeStyle = themeColor.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }
  }

  // Set up particles
  const rect = canvas.parentElement.getBoundingClientRect();
  for (let i = 0; i < particleCount; i++) {
    particles.push(new Particle(rect.width, rect.height));
  }

  resize();
  window.addEventListener('resize', resize);

  function animate() {
    const currentW = canvas.width / window.devicePixelRatio;
    const currentH = canvas.height / window.devicePixelRatio;

    ctx.clearRect(0, 0, currentW, currentH);

    // Dynamic color fetching from al-folio CSS theme variables
    const computedStyle = getComputedStyle(document.documentElement);
    const themeColor = computedStyle.getPropertyValue('--global-theme-color').trim() || 'rgba(0, 123, 255, 1)';

    particles.forEach(p => {
      p.update(currentW, currentH);
      p.draw(themeColor);
    });

    animationFrameId = requestAnimationFrame(animate);
  }

  animate();
})();
</script>
