<div class="stochastic-flow-container" style="position: relative; width: 100%; height: 300px; background: transparent; border: 1px solid var(--global-divider-color); border-radius: 6px; overflow: hidden; margin: 20px 0 20px 0;">
  <canvas id="flowCanvas" style="display: block; width: 100%; height: 100%;"></canvas>
</div>

<script>
(function() {
  const canvas = document.getElementById('flowCanvas');
  const ctx = canvas.getContext('2d');
  let animationFrameId;

  // Heightened Multivariate Configuration
  const processCount = 12;       // Increased from 4 to 12 for dense, concurrent paths
  const maxHistory = 90;         // Slightly shorter memory for crisp path evaporation
  const stepsPerFrame = 4;       // Maintains fast, sharp sub-frame jumps
  const sigma = 3.6;             // Volatility scaling parameter
  
  let processes = [];

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    initProcesses(rect.width, rect.height);
  }

  function initProcesses(w, h) {
    processes = [];
    for (let i = 0; i < processCount; i++) {
      processes.push({
        x: w * 0.15 + Math.random() * w * 0.7,
        y: h * 0.15 + Math.random() * h * 0.7,
        history: [],
        // Randomize historical memory lengths slightly per path to add organic variation
        localMaxHistory: maxHistory + Math.floor(Math.random() * 30)
      });
    }
  }

  function getGaussianPair() {
    const u1 = Math.random() || 0.0001;
    const u2 = Math.random() || 0.0001;
    const radius = Math.sqrt(-2.0 * Math.log(u1));
    const angle = 2.0 * Math.PI * u2;
    return { z0: radius * Math.cos(angle), z1: radius * Math.sin(angle) };
  }

  function updateAndDraw(w, h, themeColor) {
    processes.forEach((p, idx) => {
      
      for (let s = 0; s < stepsPerFrame; s++) {
        const noise = getGaussianPair();
        
        p.history.push({ x: p.x, y: p.y });
        
        if (p.history.length > p.localMaxHistory) {
          p.history.shift();
        }

        // Stochastic increment step
        p.x += sigma * noise.z0;
        p.y += sigma * noise.z1;

        // Skorokhod boundary reflection controls
        if (p.x < 0) { p.x = -p.x; }
        if (p.x > w) { p.x = 2 * w - p.x; }
        if (p.y < 0) { p.y = -p.y; }
        if (p.y > h) { p.y = 2 * h - p.y; }
      }

      if (p.history.length < 2) return;

      // Draw the crisp historical trace line
      ctx.beginPath();
      ctx.moveTo(p.history[0].x, p.history[0].y);
      for (let i = 1; i < p.history.length; i++) {
        ctx.lineTo(p.history[i].x, p.history[i].y);
      }

      // Layered alpha opacity to balance 12 active streams perfectly
      const alphaBase = 0.06 + ((idx % 4) * 0.03); 
      ctx.strokeStyle = themeColor.replace(')', `, ${alphaBase})`).replace('rgb', 'rgba');
      ctx.lineWidth = 1.0;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'miter'; 
      ctx.stroke();

      // Render the current path's head index coordinate dot
      ctx.beginPath();
      ctx.arc(p.x, p.y, 1.8, 0, 2 * Math.PI);
      ctx.fillStyle = themeColor.replace(')', `, ${alphaBase * 2.5})`).replace('rgb', 'rgba');
      ctx.fill();
    });
  }

  resize();
  window.addEventListener('resize', resize);

  function animate() {
    const currentW = canvas.width / window.devicePixelRatio;
    const currentH = canvas.height / window.devicePixelRatio;

    ctx.clearRect(0, 0, currentW, currentH);

    const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--global-theme-color').trim() || 'rgba(0, 123, 255, 1)';

    updateAndDraw(currentW, currentH, themeColor);

    animationFrameId = requestAnimationFrame(animate);
  }

  animate();
})();
</script>
