<div class="stochastic-flow-container" style="position: relative; width: 100%; height: 280px; background: transparent; border: 1px solid var(--global-divider-color); border-radius: 6px; overflow: hidden; margin: 20px 0;">
  <canvas id="flowCanvas" style="display: block; width: 100%; height: 100%;"></canvas>
</div>

<script>
(function() {
  const canvas = document.getElementById('flowCanvas');
  const ctx = canvas.getContext('2d');
  let animationFrameId;
  let globalTime = 0;

  // Configuration for continuous flow lines instead of tiny particles
  const lineCount = 14; 
  let streamlines = [];

  function resize() {
    const rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width * window.devicePixelRatio;
    canvas.height = rect.height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    initLines(rect.width, rect.height);
  }

  function initLines(w, h) {
    streamlines = [];
    // Distribute baseline heights evenly across the container height
    for (let i = 0; i < lineCount; i++) {
      streamlines.push({
        baseY: (h / (lineCount + 1)) * (i + 1),
        seed: Math.random() * 100
      });
    }
  }

  function drawFlowField(w, h, time, themeColor) {
    // Spatial configuration
    const resolution = 6; // Horizontal resolution step in pixels
    const slowTime = time * 0.004; // Very slow temporal drift

    streamlines.forEach((line, index) => {
      ctx.beginPath();
      
      // Calculate smooth alpha gradient based on proximity to center vertical stack
      const normalizedRank = index / lineCount;
      const verticalFade = Math.sin(normalizedRank * Math.PI); // Fades out at top/bottom bounds
      const alpha = 0.06 + verticalFade * 0.16; 

      ctx.strokeStyle = themeColor.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
      ctx.lineWidth = 1.5 + (verticalFade * 1.0); // Slightly thicker lines in the middle
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      let first = true;

      for (let x = 0; x <= w; x += resolution) {
        // Multi-frequency harmonic wave simulating a continuous smooth random process
        const freq1 = 0.0035;
        const freq2 = 0.009;
        const freq3 = 0.022;

        // Long background drift wave
        const wave1 = Math.sin(x * freq1 + slowTime + line.seed) * (h * 0.22);
        // Intersecting secondary wave structure
        const wave2 = Math.cos(x * freq2 - slowTime * 1.4 + line.seed * 2) * (h * 0.08);
        // Micro-topography ripple representing smooth structural diffusion
        const wave3 = Math.sin(x * freq3 + slowTime * 2.5 + line.seed * 3) * 6;

        // Composite localized spatial amplitude mapping
        const totalDisplacement = wave1 + wave2 + wave3;
        const currentY = line.baseY + totalDisplacement;

        // Apply smooth horizontal padding fade to avoid harsh clips at canvas edges
        const edgePadding = 60;
        let edgeFade = 1;
        if (x < edgePadding) edgeFade = x / edgePadding;
        if (x > w - edgePadding) edgeFade = (w - x) / edgePadding;
        
        const finalY = line.baseY + (totalDisplacement * edgeFade);

        if (first) {
          ctx.moveTo(x, finalY);
          first = false;
        } else {
          ctx.lineTo(x, finalY);
        }
      }
      ctx.stroke();
    });
  }

  // Hook resize triggers
  resize();
  window.addEventListener('resize', resize);

  function animate() {
    globalTime++;
    const currentW = canvas.width / window.devicePixelRatio;
    const currentH = canvas.height / window.devicePixelRatio;

    ctx.clearRect(0, 0, currentW, currentH);

    const themeColor = getComputedStyle(document.documentElement).getPropertyValue('--global-theme-color').trim() || 'rgba(0, 123, 255, 1)';

    drawFlowField(currentW, currentH, globalTime, themeColor);

    animationFrameId = requestAnimationFrame(animate);
  }

  animate();
})();
</script>
